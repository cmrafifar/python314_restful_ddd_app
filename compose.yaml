services:
  api:
    build:
      context: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENVIRONMENT: development
      APP_DEBUG: "true"
    volumes:
      - ./src:/app/src:ro,z
    command:
      - uv
      - run
      - --no-dev
      - uvicorn
      - bookstore_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
