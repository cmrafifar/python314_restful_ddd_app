name: Security

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk:
    name: Snyk dependency scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check Snyk token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::Add SNYK_TOKEN as a repository Actions secret before running this workflow."
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Export locked dependencies for Snyk
        run: >-
          uv export --locked --all-groups --no-emit-project --no-hashes
          --output-file "$RUNNER_TEMP/requirements.txt"
      - name: Install Snyk
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
      - name: Scan dependencies for vulnerabilities
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: >-
          snyk test --file="$RUNNER_TEMP/requirements.txt" --package-manager=pip
          --command=.venv/bin/python
